[package]
name = "toy-handshake"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Phase 0 spike: hand-written target output of fsmgen for a toy request/response handshake"

[features]
# Generated stateright model + built-in properties.
model = ["dep:stateright"]
# Simulates editing one row of the DSL table (r6's retry guard `<` becomes `<=`).
# In the real tool that edit regenerates both runtime and model; here both pick it
# up through the shared `Vars::r6_guard`.
planted-bug = []
# Simulates a code/model mismatch: the runtime's r6 branch forgets the var
# update `{ tries += 1 }`; the model still applies it. The model checks clean,
# and only the differential test notices. See theory.md §7.2.
planted-drift = []

[dependencies]
stateright = { workspace = true, optional = true }

[[example]]
name = "check"
required-features = ["model"]

[[test]]
name = "model_check"
required-features = ["model"]

[[test]]
name = "differential"
required-features = ["model"]
